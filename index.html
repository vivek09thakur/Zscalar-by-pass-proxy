<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Zscalar Proxy ByPass</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen grid place-items-center bg-slate-900 text-slate-200 p-6 antialiased">
  <main class="w-full max-w-sm text-center">
    <img src="/logo.svg" alt="" class="w-12 h-12 mx-auto mb-4" />
    <h1 class="text-base font-medium text-slate-50 mb-5">Zscalar Proxy ByPass</h1>
    <form onsubmit="go(event)" class="flex h-11 rounded-lg bg-slate-950 border border-slate-700 focus-within:border-blue-500 overflow-hidden">
      <input
        id="url"
        type="text"
        placeholder="example.com"
        required
        autocomplete="off"
        autofocus
        spellcheck="false"
        class="flex-1 min-w-0 px-3.5 bg-transparent text-slate-50 placeholder-slate-500 focus:outline-none"
      />
      <button type="submit" class="px-4 bg-blue-500 text-white font-medium hover:bg-blue-600 focus-visible:outline-none">
        Open
      </button>
    </form>
    <div class="mt-3 inline-flex rounded-lg border border-slate-700 p-0.5 text-xs">
      <label class="cursor-pointer">
        <input type="radio" name="mode" value="full" class="peer sr-only" checked />
        <span class="block px-3 py-1.5 rounded-md text-slate-400 peer-checked:bg-blue-500 peer-checked:text-white">Full window</span>
      </label>
      <label class="cursor-pointer">
        <input type="radio" name="mode" value="window" class="peer sr-only" />
        <span class="block px-3 py-1.5 rounded-md text-slate-400 peer-checked:bg-blue-500 peer-checked:text-white">Windowed</span>
      </label>
    </div>
    <p class="mt-4 text-xs text-slate-500">Return to <code>/_home</code> to switch sites.</p>
  </main>

  <script>
    function go(e) {
      e.preventDefault();
      let url = document.getElementById("url").value.trim();
      if (!url.startsWith("http")) url = "https://" + url;
      const mode = document.querySelector('input[name="mode"]:checked').value;
      window.location.href = "/proxy/" + encodeURIComponent(url) + "?_mode=" + mode;
    }
  </script>
</body>
</html>
